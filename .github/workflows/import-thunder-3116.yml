name: Import approved Thunder #5 recording

on:
  push:
    branches:
      - fix/realistic-dry-thunder-audio
    paths:
      - .github/workflows/import-thunder-3116.yml

permissions:
  contents: write

jobs:
  import-thunder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download and validate the CC0 recording
        shell: bash
        run: |
          set -euo pipefail
          target="app/src/main/res/raw/weather_thunderstorm_thunder.ogg"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "ROYAL-Plus-Launcher build asset import" \
            "https://bigsoundbank.com/UPLOAD/ogg/3116.ogg" \
            --output "$target"
          test -s "$target"
          test "$(head -c 4 "$target")" = "OggS"
          test "$(wc -c < "$target")" -gt 10000
          file "$target"

      - name: Commit audio resource and remove this one-off importer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/import-thunder-3116.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/weather_thunderstorm_thunder.ogg
          git add -u .github/workflows/import-thunder-3116.yml
          git commit -m "Replace dry thunder audio with Thunder #5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
