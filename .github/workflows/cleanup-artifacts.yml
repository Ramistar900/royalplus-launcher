name: ROYAL+ Artifact Cleanup

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without removing artifacts"
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-artifacts.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: royal-plus-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean older artifacts across all build types
    runs-on: ubuntu-latest
    steps:
      - name: Preview or remove older artifacts
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event_name == 'pull_request' && 'true' || inputs.dry_run }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN !== 'false';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const active = artifacts
              .filter(item => !item.expired)
              .sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id
              );

            const newestByName = new Map();
            const older = [];

            for (const artifact of active) {
              if (!newestByName.has(artifact.name)) {
                newestByName.set(artifact.name, artifact);
              } else {
                older.push(artifact);
              }
            }

            core.info(`Found ${active.length} active artifacts across ${newestByName.size} artifact name(s).`);
            for (const [name, artifact] of newestByName) {
              core.info(`Keeping newest "${name}" artifact #${artifact.id}, created ${artifact.created_at}.`);
            }

            for (const artifact of older) {
              if (dryRun) {
                core.info(`DRY RUN: would delete older "${artifact.name}" artifact #${artifact.id} created ${artifact.created_at}.`);
              } else {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted older "${artifact.name}" artifact #${artifact.id}.`);
              }
            }

            core.notice(
              dryRun
                ? `Preview complete. No artifacts were deleted; ${newestByName.size} newest artifact(s) would be kept and ${older.length} older artifact(s) would be removed.`
                : `Cleanup complete. Kept ${newestByName.size} newest artifact(s), one per artifact name, and removed ${older.length} older artifact(s).`
            );
