name: ROYAL+ Artifact Cleanup

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without removing artifacts"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: royal-plus-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean old Quran debug APK artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Preview or remove older APK artifacts
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        with:
          script: |
            const artifactName = 'ROYAL-PLUS-Quran-Debug';
            const dryRun = process.env.DRY_RUN !== 'false';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const matches = artifacts
              .filter(item => item.name === artifactName && !item.expired)
              .sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id
              );

            core.info(`Found ${matches.length} active artifacts named ${artifactName}.`);
            if (matches.length === 0) {
              core.info('Nothing to clean.');
              return;
            }

            const latest = matches[0];
            core.info(`Keeping newest APK artifact #${latest.id}, created ${latest.created_at}.`);

            for (const artifact of matches.slice(1)) {
              if (dryRun) {
                core.info(`DRY RUN: would delete artifact #${artifact.id} created ${artifact.created_at}.`);
              } else {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                core.info(`Deleted older APK artifact #${artifact.id}.`);
              }
            }

            core.notice(
              dryRun
                ? 'Preview complete. No artifacts were deleted.'
                : `Cleanup complete. Kept the newest APK and removed ${matches.length - 1} older artifact(s).`
            );
