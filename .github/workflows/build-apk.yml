name: ROYAL+ Launcher Android Build

on:
  push:
    branches: [ "main", "feature/quran-audio-clean", "fix/complete-royal-audio-fireplace", "feature/royal-adaptive-device-system", "fix/android8-native-weather-low-latency", "feature/weather-videos-optimized", "feature/weather-tv-load-optimization-main-rebased", "feature/sports-original-graphics", "fix/royalplus-abi-test-assets", "feature/sinjar-tv-embedded-integration", "feature/universal-language-translation", "feature/settings-completion-light-theme" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Verify the translation branch, or explicitly build a signed release"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - signed-release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep the current verification alive; do not cancel lint/emulator checks when another run is queued.
  cancel-in-progress: false

jobs:
  build-pr:
    name: Verify pull request build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/feature/sports-original-graphics' || github.ref == 'refs/heads/fix/complete-royal-audio-fireplace' || github.ref == 'refs/heads/feature/royal-adaptive-device-system' || github.ref == 'refs/heads/fix/android8-native-weather-low-latency' || github.ref == 'refs/heads/feature/weather-tv-load-optimization-main-rebased' || github.ref == 'refs/heads/fix/royalplus-abi-test-assets' || github.ref == 'refs/heads/feature/sinjar-tv-embedded-integration' || github.ref == 'refs/heads/feature/universal-language-translation' || github.ref == 'refs/heads/feature/settings-completion-light-theme')) || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'verify' && github.ref == 'refs/heads/feature/universal-language-translation')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and verify approved Muslim PNG icons
        run: python3 .github/scripts/prepare-muslim-png-icons.py

      - name: Verify multilingual translation fallback
        run: python3 .github/scripts/verify-universal-translation.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Royal Arabic fonts
        run: |
          mkdir -p app/src/main/res/font
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/cairo.ttf --output app/src/main/res/font/cairo.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/tajawal_regular.ttf --output app/src/main/res/font/tajawal_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/noto_kufi_arabic.ttf --output app/src/main/res/font/noto_kufi_arabic.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/amiri_regular.ttf --output app/src/main/res/font/amiri_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/aref_ruqaa_regular.ttf --output app/src/main/res/font/aref_ruqaa_regular.ttf

      - name: Download and verify offline Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 https://raw.githubusercontent.com/dotquran/corpus/c23f5cec2e95e253dc450bd0f34d09e37ba40fac/processed/quran-uthmani.json --output app/src/main/assets/quran-uthmani.json
          test "$(git hash-object app/src/main/assets/quran-uthmani.json)" = "ce2c178c3555e0d80530f96d2328c8499df756c7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/src/main/assets/quran-uthmani.json").read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})
          surahs = payload.get("surahs", [])
          assert metadata.get("source") == "Tanzil Project", metadata
          assert metadata.get("version") == "Uthmani, Version 1.1", metadata
          assert len(surahs) == 114, len(surahs)
          numbered_verses = sum(
              1 for surah in surahs for ayah in surah.get("ayahs", [])
              if int(ayah.get("number", -1)) > 0
          )
          assert numbered_verses == 6236, numbered_verses
          assert all(
              isinstance(ayah.get("text"), str) and ayah["text"].strip()
              for surah in surahs for ayah in surah.get("ayahs", [])
          ), "Quran contains a missing or blank verse"
          print(f"Verified Tanzil Uthmani text: {len(surahs)} surahs, {numbered_verses} numbered verses.")
          PY

      - name: Download Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Download and verify matching Sherpa and ONNX Runtime 1.28.2
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/royal-onnx
          curl --fail --location --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check
          curl --fail --location --retry 3 https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-android-1.28.2.zip --output /tmp/royal-onnx/onnxruntime-android-1.28.2.zip
          echo "01518867f78241138b6aa25925802e843a4fa9085af8d303d49e35bbb52aff4d  /tmp/royal-onnx/onnxruntime-android-1.28.2.zip" | sha256sum --check
          mv /tmp/royal-onnx/onnxruntime-android-1.28.2.zip app/libs/onnxruntime-android-1.28.2.aar
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p app/libs/sherpa-onnx-2.0.1.aar "jni/$abi/libonnxruntime.so" > "/tmp/royal-onnx/sherpa-$abi.so"
            unzip -p app/libs/onnxruntime-android-1.28.2.aar "jni/$abi/libonnxruntime.so" > "/tmp/royal-onnx/ort-$abi.so"
            cmp "/tmp/royal-onnx/sherpa-$abi.so" "/tmp/royal-onnx/ort-$abi.so"
          done
          unzip -l app/libs/onnxruntime-android-1.28.2.aar | grep -q 'jni/arm64-v8a/libonnxruntime4j_jni.so'

      - name: Optimize bundled media without removing features
        shell: bash
        run: |
          set -euo pipefail
          # cwebp (webp) and ffmpeg are in Ubuntu's universe component.
          # Some hosted images expose only main/restricted by default.
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Components:/ { /universe/! s/$/ universe/; }' /etc/apt/sources.list.d/ubuntu.sources
          elif command -v add-apt-repository >/dev/null 2>&1; then
            sudo add-apt-repository -y universe
          else
            echo "::error::Unable to enable Ubuntu universe for media optimization tools."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp ffmpeg
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          roots = [Path("app/src/main/res/drawable"), Path("app/src/main/res/drawable-nodpi")]
          converted = 0
          saved = 0
          for root in roots:
              if not root.exists():
                  continue
              for source in sorted(root.iterdir()):
                  if not source.is_file() or source.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
                      continue
                  original_size = source.stat().st_size
                  if original_size < 300_000:
                      continue
                  target = source.with_suffix(".webp")
                  if target.exists():
                      continue
                  temporary = target.with_name(target.name + ".tmp")
                  result = subprocess.run(
                      ["cwebp", "-quiet", "-m", "6", "-q", "89", str(source), "-o", str(temporary)],
                      check=False
                  )
                  if result.returncode == 0 and temporary.exists() and temporary.stat().st_size < original_size:
                      new_size = temporary.stat().st_size
                      temporary.replace(target)
                      source.unlink()
                      converted += 1
                      saved += original_size - new_size
                  else:
                      temporary.unlink(missing_ok=True)
          print(f"WebP resources converted: {converted}; saved {saved / 1048576:.2f} MiB.")

          video = Path("app/src/main/assets/fireplace_burning_fire_loop.mp4")
          if video.is_file():
              temporary = Path("/tmp/royal-fire-optimized.mp4")
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", str(video), "-an",
                  "-vf", "scale='min(2560,iw)':-2", "-r", "24",
                  "-c:v", "libx264", "-preset", "slow", "-crf", "26",
                  "-pix_fmt", "yuv420p", "-movflags", "+faststart", str(temporary)
              ], check=True)
              if temporary.stat().st_size < video.stat().st_size:
                  before = video.stat().st_size
                  temporary.replace(video)
                  print(f"Fireplace video optimized: {(before-video.stat().st_size)/1048576:.2f} MiB saved.")
              else:
                  print("Keeping original fireplace loop; optimized video was not smaller.")
          PY

      - name: Verify settings navigation and release update detection
        run: python3 .github/scripts/verify-settings-navigation-and-release-check.py

      - name: Verify ROYAL+ internal file manager and approved theme palette
        run: python3 .github/scripts/verify-royal-file-manager.py

      - name: Verify weather and translation regression guards
        run: python3 .github/scripts/verify-weather-translation-fixes.py

      - name: Verify static classic weather icons
        run: python3 .github/scripts/verify-classic-weather-icons.py

      - name: Verify native sports illustrations and rotating football navigation
        run: python3 .github/scripts/verify-royal-sports-graphics.py

      - name: Verify sports integration security and navigation
        run: python3 .github/scripts/verify-sports-integration.py

      - name: Download pinned SMaLL-100 tokenizer test fixture
        run: |
          set -euo pipefail
          mkdir -p app/src/test/resources
          curl --fail --location --retry 3 https://huggingface.co/casawolice/small100-onnx/resolve/a0d8498bbf489866eeff5e53b53f6997d2b299db/tokenizer.json --output app/src/test/resources/small100-tokenizer.json
          TOKENIZER_BYTES="$(stat -c%s app/src/test/resources/small100-tokenizer.json)"
          test "$TOKENIZER_BYTES" -ge 5000000
          test "$TOKENIZER_BYTES" -le 7000000

      - name: Run launcher and adaptive display unit tests
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :royal-adaptive-ui:testDebugUnitTest :app:testDebugUnitTest

      - name: Compress weather videos without removing clips or audio-free playback
        run: python3 .github/scripts/optimize-weather-videos.py

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Build minified ABI-specific test APKs
        run: /tmp/gradle-8.9/bin/gradle --no-daemon -PenableAbiSplits=true assembleRelease

      - name: Run Android API compatibility lint
        shell: bash
        run: |
          set +e
          /tmp/gradle-8.9/bin/gradle --no-daemon lintDebug
          LINT_STATUS=$?
          REPORT="$(find app/build -name lint-results-debug.txt -type f | head -n 1 || true)"
          if [[ -n "$REPORT" ]]; then
            echo "Full Android Lint report: $REPORT"
            cat "$REPORT"
          fi
          exit "$LINT_STATUS"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Identify minified class failing Android 7 startup
        if: always()
        shell: bash
        run: |
          MAP="app/build/outputs/mapping/release/mapping.txt"
          if [[ -f "$MAP" ]]; then
            echo "R8 mapping for the failing Android 7 class (if present):"
            grep -n -B 2 -A 30 ' -> v3.l4:' "$MAP" || true
          else
            echo "R8 mapping file was not generated at $MAP"
          fi

      - name: Smoke test on Android 7 (API 24)
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_LABEL: Android 7 (API 24)
          EXPECTED_API_LEVEL: "24"
        with:
          api-level: 24
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android8-smoke-test.sh

      - name: Smoke test on Android 8 (API 26)
        timeout-minutes: 20
        env:
          ANDROID_TEST_LABEL: Android 8 (API 26)
          EXPECTED_API_LEVEL: "26"
        run: bash .github/scripts/android26-emulator-smoke.sh

      - name: Publish compact ARM test APKs to an isolated draft release
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.ref == 'refs/heads/fix/royalplus-abi-test-assets' || github.ref == 'refs/heads/feature/sports-original-graphics' || github.ref == 'refs/heads/fix/complete-royal-audio-fireplace' || github.ref == 'refs/heads/feature/royal-adaptive-device-system' || github.ref == 'refs/heads/fix/android8-native-weather-low-latency' || github.ref == 'refs/heads/feature/weather-videos-optimized' || github.ref == 'refs/heads/feature/weather-tv-load-optimization-main-rebased')) || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'verify' && github.ref == 'refs/heads/feature/universal-language-translation')
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"

          ARM64_SOURCE="$(find app/build/outputs/apk/release -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          ARM32_SOURCE="$(find app/build/outputs/apk/release -type f -name '*armeabi-v7a*release*.apk' | head -n 1)"
          test -n "$ARM64_SOURCE" && test -s "$ARM64_SOURCE"
          test -n "$ARM32_SOURCE" && test -s "$ARM32_SOURCE"

          mkdir -p "$RUNNER_TEMP/royalplus-test-apks"
          ARM64_APK="$RUNNER_TEMP/royalplus-test-apks/royalplus-arm64-v8a-test.apk"
          ARM32_APK="$RUNNER_TEMP/royalplus-test-apks/royalplus-armeabi-v7a-test.apk"
          cp "$ARM64_SOURCE" "$ARM64_APK"
          cp "$ARM32_SOURCE" "$ARM32_APK"

          for APK in "$ARM64_APK" "$ARM32_APK"; do
            PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            test "$PACKAGE" = "com.royalplus.launcher.test"
            "$APKSIGNER" verify --verbose "$APK"
            sha256sum "$APK"
            du -h "$APK"
          done

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/feature/universal-language-translation" ]]; then
            TAG="royalplus-test-translation-local"
            TITLE="ROYAL+ Launcher • Local Translation Engine Test"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test -n "$PULL_REQUEST_NUMBER"
            if [[ "${GITHUB_HEAD_REF:-}" == "fix/translation-speech-only-sync" ]]; then
              TAG="royalplus-test-pr-${PULL_REQUEST_NUMBER}-translation-sync"
              TITLE="ROYAL+ Launcher • Translation Speech Sync Test"
            else
              TAG="royalplus-test-pr-${PULL_REQUEST_NUMBER}"
              TITLE="ROYAL+ Launcher • PR #${PULL_REQUEST_NUMBER} Compact ARM Test"
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/feature/sports-original-graphics" ]]; then
            TAG="royalplus-test-sports-graphics"
            TITLE="ROYAL+ Launcher • Sports Graphics Test"
          elif [[ "$GITHUB_REF" == "refs/heads/feature/weather-tv-load-optimization-main-rebased" ]]; then
            TAG="royalplus-test-interface-quality"
            TITLE="ROYAL+ Launcher • Interface Quality Test"
          elif [[ "$GITHUB_REF" == "refs/heads/fix/royalplus-abi-test-assets" ]]; then
            TAG="royalplus-test-arm-split"
            TITLE="ROYAL+ Launcher • Compact ARM Test APKs"
          else
            TAG="royalplus-test-installers"
            TITLE="ROYAL+ Launcher • Latest Test Installers"
          fi
          NOTES="$(cat <<'NOTES_EOF'
          Compact ABI-specific test APKs. Install only the APK matching the TV/device CPU architecture:
          - royalplus-arm64-v8a-test.apk: 64-bit ARM devices.
          - royalplus-armeabi-v7a-test.apk: 32-bit ARM devices.

          These are minified test builds with a separate test application ID. Offline weather clips and all bundled features remain included. This is an unpublished test draft, not a production release.
          NOTES_EOF
          )"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Refusing to overwrite an already published release."
              exit 1
            fi
            while IFS= read -r ASSET_NAME; do
              case "$ASSET_NAME" in
                royalplus-arm64-v8a-test.apk|royalplus-armeabi-v7a-test.apk) ;;
                *)
                  echo "Removing stale draft asset: $ASSET_NAME"
                  gh release delete-asset "$TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --yes
                  ;;
              esac
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "$ARM64_APK" "$ARM32_APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$ARM64_APK" "$ARM32_APK" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(",")')"
          EXPECTED="royalplus-arm64-v8a-test.apk,royalplus-armeabi-v7a-test.apk"
          if [[ "$ASSETS" != "$EXPECTED" ]]; then
            echo "::error::Expected exactly the two compact ARM APKs; found: $ASSETS"
            exit 1
          fi

          {
            echo "### Compact ROYAL+ ARM test APKs are ready"
            echo
            echo "- [64-bit ARM APK](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/royalplus-arm64-v8a-test.apk)"
            echo "- [32-bit ARM APK](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/royalplus-armeabi-v7a-test.apk)"
            echo
            echo "Draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "Source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  release-main:
    name: Build signed APK and create GitHub draft release
    if: (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'signed-release' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/quran-audio-clean'))
    runs-on: ubuntu-latest
    env:
      ROYALPLUS_VERSION_CODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_number || '1' }}
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and verify approved Muslim PNG icons
        run: python3 .github/scripts/prepare-muslim-png-icons.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing signing configuration
        if: steps.signing.outputs.available != 'true'
        run: echo "::warning::Signed release skipped. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD repository secrets."

      - name: Fetch Royal Arabic fonts
        run: |
          mkdir -p app/src/main/res/font
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/cairo.ttf --output app/src/main/res/font/cairo.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/tajawal_regular.ttf --output app/src/main/res/font/tajawal_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/noto_kufi_arabic.ttf --output app/src/main/res/font/noto_kufi_arabic.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/amiri_regular.ttf --output app/src/main/res/font/amiri_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/aref_ruqaa_regular.ttf --output app/src/main/res/font/aref_ruqaa_regular.ttf

      - name: Verify native sports illustrations and rotating football navigation
        run: python3 .github/scripts/verify-royal-sports-graphics.py

      - name: Verify sports integration security and navigation
        run: python3 .github/scripts/verify-sports-integration.py

      - name: Download and verify offline Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 https://raw.githubusercontent.com/dotquran/corpus/c23f5cec2e95e253dc450bd0f34d09e37ba40fac/processed/quran-uthmani.json --output app/src/main/assets/quran-uthmani.json
          test "$(git hash-object app/src/main/assets/quran-uthmani.json)" = "ce2c178c3555e0d80530f96d2328c8499df756c7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/src/main/assets/quran-uthmani.json").read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})
          surahs = payload.get("surahs", [])
          assert metadata.get("source") == "Tanzil Project", metadata
          assert metadata.get("version") == "Uthmani, Version 1.1", metadata
          assert len(surahs) == 114, len(surahs)
          numbered_verses = sum(
              1 for surah in surahs for ayah in surah.get("ayahs", [])
              if int(ayah.get("number", -1)) > 0
          )
          assert numbered_verses == 6236, numbered_verses
          assert all(
              isinstance(ayah.get("text"), str) and ayah["text"].strip()
              for surah in surahs for ayah in surah.get("ayahs", [])
          ), "Quran contains a missing or blank verse"
          print(f"Verified Tanzil Uthmani text: {len(surahs)} surahs, {numbered_verses} numbered verses.")
          PY

      - name: Download Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Restore private release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/royalplus-release.keystore"
          chmod 600 "$RUNNER_TEMP/royalplus-release.keystore"

      - name: Download and verify matching Sherpa and ONNX Runtime 1.28.2
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/royal-onnx
          curl --fail --location --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check
          curl --fail --location --retry 3 https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-android-1.28.2.zip --output /tmp/royal-onnx/onnxruntime-android-1.28.2.zip
          echo "01518867f78241138b6aa25925802e843a4fa9085af8d303d49e35bbb52aff4d  /tmp/royal-onnx/onnxruntime-android-1.28.2.zip" | sha256sum --check
          mv /tmp/royal-onnx/onnxruntime-android-1.28.2.zip app/libs/onnxruntime-android-1.28.2.aar
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p app/libs/sherpa-onnx-2.0.1.aar "jni/$abi/libonnxruntime.so" > "/tmp/royal-onnx/sherpa-$abi.so"
            unzip -p app/libs/onnxruntime-android-1.28.2.aar "jni/$abi/libonnxruntime.so" > "/tmp/royal-onnx/ort-$abi.so"
            cmp "/tmp/royal-onnx/sherpa-$abi.so" "/tmp/royal-onnx/ort-$abi.so"
          done
          unzip -l app/libs/onnxruntime-android-1.28.2.aar | grep -q 'jni/arm64-v8a/libonnxruntime4j_jni.so'

      - name: Optimize bundled media without removing features
        shell: bash
        run: |
          set -euo pipefail
          # cwebp (webp) and ffmpeg are in Ubuntu's universe component.
          # Some hosted images expose only main/restricted by default.
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Components:/ { /universe/! s/$/ universe/; }' /etc/apt/sources.list.d/ubuntu.sources
          elif command -v add-apt-repository >/dev/null 2>&1; then
            sudo add-apt-repository -y universe
          else
            echo "::error::Unable to enable Ubuntu universe for media optimization tools."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp ffmpeg
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          roots = [Path("app/src/main/res/drawable"), Path("app/src/main/res/drawable-nodpi")]
          converted = 0
          saved = 0
          for root in roots:
              if not root.exists():
                  continue
              for source in sorted(root.iterdir()):
                  if not source.is_file() or source.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
                      continue
                  original_size = source.stat().st_size
                  if original_size < 300_000:
                      continue
                  target = source.with_suffix(".webp")
                  if target.exists():
                      continue
                  temporary = target.with_name(target.name + ".tmp")
                  result = subprocess.run(
                      ["cwebp", "-quiet", "-m", "6", "-q", "89", str(source), "-o", str(temporary)],
                      check=False
                  )
                  if result.returncode == 0 and temporary.exists() and temporary.stat().st_size < original_size:
                      new_size = temporary.stat().st_size
                      temporary.replace(target)
                      source.unlink()
                      converted += 1
                      saved += original_size - new_size
                  else:
                      temporary.unlink(missing_ok=True)
          print(f"WebP resources converted: {converted}; saved {saved / 1048576:.2f} MiB.")

          video = Path("app/src/main/assets/fireplace_burning_fire_loop.mp4")
          if video.is_file():
              temporary = Path("/tmp/royal-fire-optimized.mp4")
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", str(video), "-an",
                  "-vf", "scale='min(2560,iw)':-2", "-r", "24",
                  "-c:v", "libx264", "-preset", "slow", "-crf", "26",
                  "-pix_fmt", "yuv420p", "-movflags", "+faststart", str(temporary)
              ], check=True)
              if temporary.stat().st_size < video.stat().st_size:
                  before = video.stat().st_size
                  temporary.replace(video)
                  print(f"Fireplace video optimized: {(before-video.stat().st_size)/1048576:.2f} MiB saved.")
              else:
                  print("Keeping original fireplace loop; optimized video was not smaller.")
          PY

      - name: Compress weather videos without removing clips or audio-free playback
        run: python3 .github/scripts/optimize-weather-videos.py

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon -ProyalplusVersionCode="$ROYALPLUS_VERSION_CODE" assembleDebug

      - name: Run Android API compatibility lint
        shell: bash
        run: |
          set +e
          /tmp/gradle-8.9/bin/gradle --no-daemon lintDebug
          LINT_STATUS=$?
          REPORT="$(find app/build -name lint-results-debug.txt -type f | head -n 1 || true)"
          if [[ -n "$REPORT" ]]; then
            echo "Full Android Lint report: $REPORT"
            cat "$REPORT"
          fi
          exit "$LINT_STATUS"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/royalplus-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: /tmp/gradle-8.9/bin/gradle --no-daemon -PenableAbiSplits=true -ProyalplusVersionCode="$ROYALPLUS_VERSION_CODE" assembleRelease

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          mapfile -t RELEASE_APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#RELEASE_APKS[@]}" -gt 0
          for APK in "${RELEASE_APKS[@]}"; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android 7 (API 24)
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_LABEL: Android 7 (API 24)
          EXPECTED_API_LEVEL: "24"
        with:
          api-level: 24
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/android8-smoke-test.sh

      - name: Smoke test on Android 8 (API 26)
        timeout-minutes: 20
        env:
          ANDROID_TEST_LABEL: Android 8 (API 26)
          EXPECTED_API_LEVEL: "26"
        run: bash .github/scripts/android26-emulator-smoke.sh

      - name: Publish automatic signed release on main or keep test draft
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_AVAILABLE: ${{ steps.signing.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"

          IS_PRODUCTION_RELEASE=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            IS_PRODUCTION_RELEASE=true
            TAG="royalplus-${GITHUB_RUN_NUMBER}"
            TITLE="ROYAL+ Launcher ${GITHUB_RUN_NUMBER}"
          else
            TAG="royalplus-test-${GITHUB_RUN_NUMBER}"
            TITLE="ROYAL+ Launcher test build ${GITHUB_RUN_NUMBER}"
          fi

          mapfile -t RELEASE_APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [[ "$IS_PRODUCTION_RELEASE" == "true" ]]; then
            if [[ "$SIGNED_AVAILABLE" != "true" || "${#RELEASE_APKS[@]}" -eq 0 ]]; then
              echo "::error::A production release requires configured signing secrets and signed ABI APKs."
              exit 1
            fi
            ASSETS=("${RELEASE_APKS[@]}")
            NOTES="Automatically published from verified main commit ${GITHUB_SHA}. This release passed assembleDebug, Android Lint, and Android 8 (API 26) emulator install/startup checks. The signed APKs are split by CPU ABI to reduce download size; install the APK matching the TV/device architecture."
          else
            ASSETS=("$DEBUG_APK")
            NOTES="Test build from commit ${GITHUB_SHA}. This draft is not a production release."
            if [[ "$SIGNED_AVAILABLE" == "true" && "${#RELEASE_APKS[@]}" -gt 0 ]]; then
              ASSETS+=("${RELEASE_APKS[@]}")
              NOTES="$NOTES Signed ABI-specific release APKs are included for installation-size testing."
            else
              NOTES="$NOTES Signing secrets are not configured, so only the debug APK is attached."
            fi
          fi

          echo "APK sizes:"
          for APK in "${ASSETS[@]}"; do
            du -h "$APK"
          done

          if [[ "$IS_PRODUCTION_RELEASE" == "true" ]]; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "::error::Refusing to overwrite an already published release."
                exit 1
              fi
              gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH -F draft=false -F prerelease=false
            else
              gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
            fi
          else
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "::error::Refusing to modify an already published release."
                exit 1
              fi
              gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES"
            else
              gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES"
            fi
          fi
