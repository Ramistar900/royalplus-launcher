name: ROYAL+ Launcher Android Build

on:
  push:
    branches: [ "main", "feature/quran-audio-clean" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pr:
    name: Verify pull request build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Royal Arabic fonts
        run: |
          mkdir -p app/src/main/res/font
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/cairo.ttf --output app/src/main/res/font/cairo.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/tajawal_regular.ttf --output app/src/main/res/font/tajawal_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/noto_kufi_arabic.ttf --output app/src/main/res/font/noto_kufi_arabic.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/amiri_regular.ttf --output app/src/main/res/font/amiri_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/aref_ruqaa_regular.ttf --output app/src/main/res/font/aref_ruqaa_regular.ttf

      - name: Download and verify offline Quran text
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 https://raw.githubusercontent.com/dotquran/corpus/c23f5cec2e95e253dc450bd0f34d09e37ba40fac/processed/quran-uthmani.json --output app/src/main/assets/quran-uthmani.json
          test "$(git hash-object app/src/main/assets/quran-uthmani.json)" = "ce2c178c3555e0d80530f96d2328c8499df756c7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/src/main/assets/quran-uthmani.json").read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})
          surahs = payload.get("surahs", [])
          assert metadata.get("source") == "Tanzil Project", metadata
          assert metadata.get("version") == "Uthmani, Version 1.1", metadata
          assert len(surahs) == 114, len(surahs)
          numbered_verses = sum(
              1 for surah in surahs for ayah in surah.get("ayahs", [])
              if int(ayah.get("number", -1)) > 0
          )
          assert numbered_verses == 6236, numbered_verses
          assert all(
              isinstance(ayah.get("text"), str) and ayah["text"].strip()
              for surah in surahs for ayah in surah.get("ayahs", [])
          ), "Quran contains a missing or blank verse"
          print(f"Verified Tanzil Uthmani text: {len(surahs)} surahs, {numbered_verses} numbered verses.")
          PY

      - name: Download Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Run Android API compatibility lint
        run: /tmp/gradle-8.9/bin/gradle --no-daemon lintDebug

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android 8 (API 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.royalplus.launcher
            adb shell am start -W -n com.royalplus.launcher/.MainActivity
            for attempt in $(seq 1 20); do
              if adb shell pidof com.royalplus.launcher >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            adb shell pidof com.royalplus.launcher | grep -Eq '[0-9]+'
            APP_CRASH_LOG="$(adb logcat -d -v brief -s AndroidRuntime:E | grep -B3 -A20 'Process: com.royalplus.launcher' || true)"
            if [[ -n "$APP_CRASH_LOG" ]]; then
              printf '%s\\n' "$APP_CRASH_LOG"
              exit 1
            fi
            echo "Android 8 API 26 install and launcher startup passed."

  release-main:
    name: Build signed APK and create GitHub draft release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/quran-audio-clean'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing signing configuration
        if: steps.signing.outputs.available != 'true'
        run: echo "::warning::Signed release skipped. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD repository secrets."

      - name: Fetch Royal Arabic fonts
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p app/src/main/res/font
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/cairo.ttf --output app/src/main/res/font/cairo.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/tajawal_regular.ttf --output app/src/main/res/font/tajawal_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/noto_kufi_arabic.ttf --output app/src/main/res/font/noto_kufi_arabic.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/amiri_regular.ttf --output app/src/main/res/font/amiri_regular.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/Ramistar900/almalaki/main/app/src/main/res/font/aref_ruqaa_regular.ttf --output app/src/main/res/font/aref_ruqaa_regular.ttf

      - name: Download and verify offline Quran text
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 https://raw.githubusercontent.com/dotquran/corpus/c23f5cec2e95e253dc450bd0f34d09e37ba40fac/processed/quran-uthmani.json --output app/src/main/assets/quran-uthmani.json
          test "$(git hash-object app/src/main/assets/quran-uthmani.json)" = "ce2c178c3555e0d80530f96d2328c8499df756c7"
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/src/main/assets/quran-uthmani.json").read_text(encoding="utf-8"))
          metadata = payload.get("metadata", {})
          surahs = payload.get("surahs", [])
          assert metadata.get("source") == "Tanzil Project", metadata
          assert metadata.get("version") == "Uthmani, Version 1.1", metadata
          assert len(surahs) == 114, len(surahs)
          numbered_verses = sum(
              1 for surah in surahs for ayah in surah.get("ayahs", [])
              if int(ayah.get("number", -1)) > 0
          )
          assert numbered_verses == 6236, numbered_verses
          assert all(
              isinstance(ayah.get("text"), str) and ayah["text"].strip()
              for surah in surahs for ayah in surah.get("ayahs", [])
          ), "Quran contains a missing or blank verse"
          print(f"Verified Tanzil Uthmani text: {len(surahs)} surahs, {numbered_verses} numbered verses.")
          PY

      - name: Download Gradle 8.9
        if: steps.signing.outputs.available == 'true'
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Restore private release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/royalplus-release.keystore"
          chmod 600 "$RUNNER_TEMP/royalplus-release.keystore"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/royalplus-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug assembleRelease

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Create or update GitHub draft release
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="royalplus-build-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s "$DEBUG_APK"
          TITLE="ROYAL+ Launcher build ${GITHUB_RUN_NUMBER}"
          NOTES="Debug and signed APKs built from commit ${GITHUB_SHA}. app-debug.apk is for testing; app-release.apk is signed for installation. This is a draft release; review and publish it manually."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "::error::Refusing to modify an already published release."
              exit 1
            fi
            gh release upload "$TAG" "$APK" "$DEBUG_APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$DEBUG_APK" --repo "$GITHUB_REPOSITORY" --draft --title "$TITLE" --notes "$NOTES"
          fi
