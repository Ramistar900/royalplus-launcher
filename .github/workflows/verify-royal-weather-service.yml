name: Verify ROYAL+ Weather Service

on:
  push:
    branches:
      - feature/royalplus-free-weather-service
    paths:
      - "weather-service/**"
      - ".github/workflows/verify-royal-weather-service.yml"
  pull_request:
    paths:
      - "weather-service/**"
      - ".github/workflows/verify-royal-weather-service.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    name: Weather gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-service/cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run worker unit tests
        run: npm test
